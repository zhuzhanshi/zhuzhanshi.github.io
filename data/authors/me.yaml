bio: |
  Zhanshi Zhu is a Postdoctoral Researcher at King Abdullah University of
  Science and Technology (KAUST), Biomedical Sciences Division. His research focuses on continual learning
  for medical image analysis, with particular interests in medical image
  segmentation, foundation models, knowledge distillation, ophthalmic AI, cardiac AI, and
  robust learning under domain shifts. He is based in Thuwal, Saudi Arabia.

